steps:
  # 1. Build image với Docker Buildx và cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/luminalearn/web:$SHORT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/luminalearn/web:latest'
      - '.'

  # 2. Push image lên Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/luminalearn/web:latest'

  # 3. Deploy lên Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'luminalearn-web'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/luminalearn/web:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '1800'
      - '--concurrency'
      - '10'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/luminalearn/web:latest'

options:
  machineType: 'E2_HIGHCPU_8'

